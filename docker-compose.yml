services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: meubairro-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17
    container_name: meubairro-postgres
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: meubairro
      POSTGRES_USER: meubairro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meubairro_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-dados:/var/lib/postgresql/data

volumes:
  postgres-dados:
