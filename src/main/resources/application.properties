spring.application.name=meu-bairro-api
server.port=${PORT:8080}
server.forward-headers-strategy=native

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/meubairro;LOCK_TIMEOUT=10000}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.data.web.pageable.max-page-size=50

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=3s
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.multiplier=2

spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=${GEMINI_MODELO:gemini-3.5-flash-lite}
spring.ai.google.genai.chat.options.temperature=0.2
spring.ai.google.genai.chat.options.response-mime-type=application/json
spring.autoconfigure.exclude=\
  org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration,\
  org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration

logging.level.org.springframework.ai.retry.autoconfigure=ERROR

spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=30s

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.default-produces-media-type=application/json

meubairro.ia.habilitada=${IA_HABILITADA:true}
meubairro.jwt.secret=${JWT_SECRET:}
meubairro.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:120}
meubairro.usuarios-teste.habilitado=${USUARIOS_TESTE_HABILITADO:true}
meubairro.usuarios-teste.senha=${USUARIOS_TESTE_SENHA:Teste@123}
meubairro.cors.origens=${CORS_ORIGENS:http://localhost:8081,http://localhost:19006}
meubairro.fotos.pasta=${FOTOS_PASTA:./data/fotos}
meubairro.fotos.azure.container-url=${FOTOS_AZURE_CONTAINER_URL:}
meubairro.fotos.azure.sas-token=${FOTOS_AZURE_SAS_TOKEN:}
